    <div id="fairy-container"></div>

    <script>
        const container = document.getElementById("fairy-container");

        const colors = ["#98282a", "#386641", "#9c6615", "#f2e8cf", "#ffb012"]; // two color fairy dust

        document.addEventListener("mousemove", (e) => {
            // create 2–3 particles per move frame for magic effect
            for (let i = 0; i < 3; i++) {
                createFairy(e.clientX, e.clientY);
            }
        });

        function createFairy(x, y) {
            const fairy = document.createElement("div");
            fairy.classList.add("fairy");

            // randomize color
            fairy.style.background = colors[Math.floor(Math.random() * colors.length)];

            // random offset for more organic look
            const offsetX = (Math.random() - 0.5) * 12;
            const offsetY = (Math.random() - 0.5) * 12;

            fairy.style.left = x + offsetX + "px";
            fairy.style.top = y + offsetY + "px";

            // small random sizes
            const size = Math.random() * 3 + 2; // 3–6px
            fairy.style.width = size + "px";
            fairy.style.height = size + "px";

            container.appendChild(fairy);

            // remove after animation
            setTimeout(() => fairy.remove(), 1000);
        }
    </script>

        // ---- Popup logic ----
        const popup = document.getElementById("popup");
        const popupIcon = document.getElementById("popup-icon");
        const popupText = document.getElementById("popup-text");
        const popupTitle = document.getElementById("popup-title");
        const popupLink = document.getElementById("popup-link");

        document.querySelectorAll("[id^='d']").forEach(day => {
            day.addEventListener("click", () => {
                const n = Number(day.id.slice(1));
                const m = messages[n];

                popupIcon.textContent = m.icon;
                popupTitle.textContent = m.title;
                popupText.textContent = m.text;
                popupLink.href = m.link;

                popup.style.display = "flex";

                startSparkles();
            });
        });

        document.getElementById("popup-close").onclick = () => popup.style.display = "none";
        popup.onclick = e => { if (e.target === popup) popup.style.display = "none"; };


        // ---- Popup sparkles ----
        const canvas = document.getElementById("sparkle-canvas");
        const ctx = canvas.getContext("2d");

        function startSparkles() {
            canvas.width = popup.clientWidth;
            canvas.height = popup.clientHeight;

            const particles = [];

            for (let i=0; i<30; i++) {
                particles.push({
                    x: canvas.width/2,
                    y: canvas.height/2,
                    dx: (Math.random() - .5) * 2,
                    dy: (Math.random() - .5) * 2,
                    size: Math.random()*3+2,
                    life: 40 + Math.random()*20
                });
            }

            function animate() {
                ctx.clearRect(0,0,canvas.width,canvas.height);

                particles.forEach(p => {
                    p.x += p.dx;
                    p.y += p.dy;
                    p.size *= .95;
                    p.life--;

                    ctx.fillStyle = "gold";
                    ctx.beginPath();
                    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
                    ctx.fill();
                });

                if (particles.some(p=>p.life>0)) requestAnimationFrame(animate);
            }
            animate();
        }


        // ---- OPENING SPARKLE ANIMATION ----
        const opening = document.getElementById("opening");
        const oCanvas = document.getElementById("opening-sparkles");
        const oCtx = oCanvas.getContext("2d");

        function openingSparkles() {
            oCanvas.width = window.innerWidth;
            oCanvas.height = window.innerHeight;
            const part = [];

            for (let i = 0; i < 80; i++) {
                part.push({
                    x: Math.random() * oCanvas.width,
                    y: Math.random() * oCanvas.height,
                    size: Math.random() * 3 + 1,
                    dy: Math.random() * -1 - 0.2,
                    life: 200 + Math.random()*60
                });
            }

            function draw() {
                oCtx.clearRect(0,0,oCanvas.width,oCanvas.height);
                part.forEach(p => {
                    p.y += p.dy;
                    p.life--;
                    oCtx.fillStyle = "gold";
                    oCtx.fillRect(p.x,p.y,p.size,p.size);
                });
                if (part.some(p=>p.life>0)) requestAnimationFrame(draw);
            }

            draw();
        }
        openingSparkles();
