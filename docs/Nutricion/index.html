<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Meal Plan — Semana por Estação</title>
  <style>
    :root{--bg:#f7f7f8;--card:#fff;--muted:#6b7280;--accent:#0f766e;--glass:rgba(255,255,255,0.6)}
    body{font-family:Inter,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial,sans-serif;margin:0;background:linear-gradient(180deg,#eef2f7 0%,var(--bg)100%);color:#0f172a}
    .wrap{max-width:1100px;margin:28px auto;padding:20px}
    header{display:flex;gap:16px;align-items:center;margin-bottom:18px}
    h1{font-size:20px;margin:0}
    .controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
    input[type="search"],select{padding:10px 12px;border-radius:10px;border:1px solid #e6e9ee;background:var(--card);min-width:220px}
    button{padding:10px 12px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:18px}
    .card{background:var(--card);border-radius:12px;padding:12px;box-shadow:0 6px 18px rgba(16,24,40,0.06);display:flex;flex-direction:column;gap:8px}
    .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
    .title{font-weight:600}
    .desc{font-size:14px;color:#111827}
    .chips{display:flex;gap:8px;flex-wrap:wrap}
    .chip{background:#f1f5f9;padding:6px 8px;border-radius:999px;font-size:12px;color:#0f172a}
    .macros{display:flex;gap:8px;align-items:center;margin-top:8px}
    .bar{height:8px;background:#eef2ff;border-radius:6px;flex:1;overflow:hidden}
    .bar > i{display:block;height:100%}
    .p{background:#c7f9e7}
    .c{background:#ffe7c7}
    .f{background:#ffd6e0}
    footer{margin-top:18px;font-size:13px;color:var(--muted)}
    .toolbar{display:flex;gap:8px;align-items:center}
    .hidden{display:none}
    .table-view{width:100%;border-collapse:collapse;margin-top:12px}
    .table-view th,.table-view td{padding:8px;border-bottom:1px solid #eef2f7;text-align:left;font-size:13px}
    .download{background:#0b5b65}
    @media(min-width:900px){h1{font-size:22px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Meal Plan — 4 semanas sazonais (Portugal)</h1>
        <div class="controls">
          <input id="search" type="search" placeholder="Pesquisar por nome, descrição, nutriente..." />
          <select id="seasonFilter">
            <option value="">Todas as estações</option>
            <option>Primavera</option>
            <option>Verão</option>
            <option>Outono</option>
            <option>Inverno</option>
          </select>
          <select id="mealFilter">
            <option value="">Todas as refeições</option>
            <option value="pequeno-almoco">Pequeno-almoço</option>
            <option value="almoco">Almoço</option>
            <option value="jantar">Jantar</option>
            <option value="ceia">Ceia</option>
          </select>
          <div class="toolbar">
            <button id="toggleView">Alternar Vista Tabela/Cartões</button>
            <button id="download" class="download">Descarregar CSV</button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div id="cards" class="grid"></div>
      <div id="table" class="hidden">
        <table class="table-view" id="resultsTable">
          <thead><tr><th>Estação</th><th>Dia</th><th>Refeição</th><th>Nome</th><th>Descrição</th><th>kcal</th><th>Proteína %</th><th>Carb %</th><th>Gordura %</th><th>Principais nutrientes</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </main>

    <footer>
      Pesquise por ingredientes, nutrientes ou filtre por estação e tipo de refeição. Valores aproximados ~430 kcal por refeição.
    </footer>
  </div>

    ];

    // Helpers
    const cardsEl = document.getElementById('cards');
    const tableBody = document.querySelector('#resultsTable tbody');
    const searchInput = document.getElementById('search');
    const seasonFilter = document.getElementById('seasonFilter');
    const mealFilter = document.getElementById('mealFilter');
    const toggleBtn = document.getElementById('toggleView');
    const cardsView = document.getElementById('cards');
    const tableView = document.getElementById('table');
    const downloadBtn = document.getElementById('download');

    function renderCard(meal){
      const div = document.createElement('div');
      div.className='card';
      div.innerHTML = `
        <div class="meta"><div>${meal.season} · Dia ${meal.day}</div><div>${meal.kcal} kcal</div></div>
        <div class="title">${meal.name}</div>
        <div class="desc">${meal.description}</div>
        <div class="chips"><span class="chip">${meal.meal_time}</span><span class="chip">Proteína ${meal.protein_pct}%</span><span class="chip">Carb ${meal.carb_pct}%</span><span class="chip">Gord ${meal.fat_pct}%</span></div>
        <div class="macros">
          <div style="width:120px;font-size:12px;color:var(--muted)">Macros visual</div>
          <div class="bar"><i class="p" style="width:${meal.protein_pct}%"></i></div>
          <div class="bar"><i class="c" style="width:${meal.carb_pct}%"></i></div>
          <div class="bar"><i class="f" style="width:${meal.fat_pct}%"></i></div>
        </div>
        <div style="font-size:13px;color:var(--muted)">Principais: ${meal.key_nutrients}</div>
      `;
      return div;
    }

    function renderTableRow(meal){
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${meal.season}</td><td>${meal.day}</td><td>${meal.meal_time}</td><td>${meal.name}</td><td>${meal.description}</td><td>${meal.kcal}</td><td>${meal.protein_pct}%</td><td>${meal.carb_pct}%</td><td>${meal.fat_pct}%</td><td>${meal.key_nutrients}</td>`;
      return tr;
    }

    function matchesFilter(meal, q, season, mealTime){
      const text = `${meal.name} ${meal.description} ${meal.key_nutrients} ${meal.season}`.toLowerCase();
      if(q && !text.includes(q)) return false;
      if(season && meal.season !== season) return false;
      if(mealTime && meal.meal_time !== mealTime) return false;
      return true;
    }

    function refresh(){
      const q = searchInput.value.trim().toLowerCase();
      const season = seasonFilter.value;
      const mealTime = mealFilter.value;
      cardsEl.innerHTML='';
      tableBody.innerHTML='';
      const filtered = MEALS.filter(m=>matchesFilter(m,q,season,mealTime));
      if(cardsView.classList.contains('hidden')){
        // table visible
        filtered.forEach(m=>tableBody.appendChild(renderTableRow(m)));
      } else {
        filtered.forEach(m=>cardsEl.appendChild(renderCard(m)));
      }
    }

    // Initial render
    refresh();

    // Events
    searchInput.addEventListener('input',refresh);
    seasonFilter.addEventListener('change',refresh);
    mealFilter.addEventListener('change',refresh);
    toggleBtn.addEventListener('click',()=>{
      const showingTable = !tableView.classList.contains('hidden');
      if(showingTable){
        tableView.classList.add('hidden');
        cardsView.classList.remove('hidden');
        toggleBtn.textContent='Alternar Vista Tabela/Cartões';
      } else {
        tableView.classList.remove('hidden');
        cardsView.classList.add('hidden');
        toggleBtn.textContent='Alternar Vista Cartões/Tabela';
      }
      refresh();
    });

    function toCSV(rows){
      const header = ['season','day','meal_time','name','description','kcal','protein_pct','carb_pct','fat_pct','key_nutrients'];
      const lines = [header.join(',')];
      rows.forEach(r=>{
        const vals = header.map(h=>{
          const v = (r[h] === undefined || r[h] === null) ? '' : String(r[h]);
          if(v.includes(',')||v.includes('\n')||v.includes('"')) return '"'+v.replace(/"/g,'""')+'"';
          return v;
        });
        lines.push(vals.join(','));
      });
      return lines.join('\n');
    }

    downloadBtn.addEventListener('click',()=>{
      const q = searchInput.value.trim().toLowerCase();
      const season = seasonFilter.value;
      const mealTime = mealFilter.value;
      const filtered = MEALS.filter(m=>matchesFilter(m,q,season,mealTime));
      const csv = toCSV(filtered);
      const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'meal_plan_filtered.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });
  </script>
