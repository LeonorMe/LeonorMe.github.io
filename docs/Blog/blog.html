<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LEANOR</title>
        <link rel="stylesheet" href="styles/style.css">
        <script
            src="https://code.jquery.com/jquery-3.3.1.js"
            integrity="sha256-2Kok7MbOyxpgUVvAk/HJ2jigOSYS2auK4Pfzbm7uH60="
            crossorigin="anonymous">
        </script>
        <!--script src="script.js"></script-->
        <script> 
            $(function(){
                $("header").load("subpages/header.html"); 
                $("footer").load("subpages/footer.html"); 
            });
        </script>
    </head>
    <body id="index">
        
        <header></header>
        
        <main>
            <div class="to-cover">      
            </div>  
            <h1>Creative Arts & Crafts Blog</h1>

            <section class="search">
                <div class="search-bar">

                    <button id="select" type="button">
                    <span id="selectText">All topics</span>
                    <span class="arrow">▾</span>
                    </button>

                    <ul id="list">
                    <li class="option">All topics</li>
                    <li class="option">Sewing</li>
                    <li class="option">Painting</li>
                    </ul>

                    <input type="search" placeholder="Search in all topics" id="search-in">

                </div>
            </section>

            
            <section class="posts">

            </section>
            
        </main>
        
        <footer></footer>
        
        <script src="getPosts.js"></script>
        <script>
            //getAllPosts();
            getTopicPosts();
            search();
        </script>

        
        <script>
        const select=document.getElementById("select");
        const list=document.getElementById("list");
        const text=document.getElementById("selectText");
        const input=document.getElementById("search-in");

        select.onclick=()=>list.classList.toggle("show");

        document.querySelectorAll(".option").forEach(opt=> {
                opt.onclick=()=> {
                    text.textContent=opt.textContent;

                    input.placeholder=`Search in $ {
                        opt.textContent
                    }

                    `;
                    list.classList.remove("show");
                }

                ;
            });

        document.addEventListener("click", e=> {
                if ( !select.contains(e.target) && !list.contains(e.target)) {
                    list.classList.remove("show");
                }
            });
        </script>
    </body>
</html>
