<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Collection</title>
        <link rel="stylesheet" href="assets/styles/styles.css">
        <link rel="stylesheet" href="assets/styles/style_portfolio.css">

        <script
            src="https://code.jquery.com/jquery-3.3.1.js"
            integrity="sha256-2Kok7MbOyxpgUVvAk/HJ2jigOSYS2auK4Pfzbm7uH60="
            crossorigin="anonymous">
        </script>
        <script> 
        $(function(){
            $(".header").load("header.html"); 
            $(".footer").load("footer.html"); 
        });
        </script>
    </head>
    <body>
        <div class="header"></div>
        
        <main>
            <h1>Autumn 24</h1>
            <h2>Nature elements</h2>
            <h3>Austria</h3>
            <p>This colection celebrates all basic elements that are part of nature and allow it to live.</p>
            <div class="listColection">
                <!-- Filled by the srcipt at the bottom -->
            </div>
        </main>

        
        <div class="footer"></div>
        
        <script>
            let designs = null;
            fetch('last_collection.json')
            .then(response => response.json())
            .then(data => {
                designs = data;
                addDataToHTML();
            })
            let listColection = document.querySelector('.listColection');
            
            function addDataToHTML(){
                designs.forEach(design => {
                    let newDesign = document.createElement('a');
                    newDesign.href = 'detail.html?id=' + design.id;
                    newDesign.classList.add('item');
                    newDesign.innerHTML =`
                        <img src="${design.image}" alt="image_${design.id}">
                        `;
                    listColection.appendChild(newDesign)
                })
            }
        </script>
    </body>
</html>
