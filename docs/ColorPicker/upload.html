<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette - upload</title>
    <link rel="stylesheet" href="style.css">
    <script
        src="https://code.jquery.com/jquery-3.3.1.js"
        integrity="sha256-2Kok7MbOyxpgUVvAk/HJ2jigOSYS2auK4Pfzbm7uH60="
        crossorigin="anonymous">
    </script>
    <script> 
        $(function(){
            $("header").load("header.html"); 
            $("footer").load("footer.html"); 
        });
    </script>
</head>
<body id="upload">
    <header></header>

    <h1>Upload your image</h1>
    <!--p>To extract a beautiful color palette.</p-->

    <div class="hero">
        <label for="input-file" id="drop-area">
            <input type="file" accept="image/*" id="input-file" hidden>
            <div id="img-view">
                <ion-icon name="cloud-upload" size="large"></ion-icon>
                <p>Drag and drop or click here<br>to upload image</p>
                <span>Upload any images from desktop</span>
            </div>
        </label>
        <div id="result">
            <div id="img-zone">
                <img src="" alt="" id="uploaded-img">
            </div>
            <div id="colors-zone">
                <div>.</div>
                <div>.</div>
                <div>.</div>
                <div>.</div>
                <div>.</div>
            </div>
        </div>
    </div>

    <div class="footer-logo-fixed">
        <a href="../index.html">
        <img src="../logo.png" alt="LM-logo">
        </a>
    </div>

    <footer></footer>

    <script src="upload.js"></script>
</body>
</html>
